apiVersion: v1
kind: ConfigMap
metadata:
  name: leviathan-spark-script
  namespace: neo4j
data:
  etl.py: |
    from pyspark.sql import SparkSession, functions as F
    import os
    import json
    import base64
    import urllib.request

    spark = (
        SparkSession.builder
        .appName("LeviathanSecurityETL")
        .getOrCreate()
    )

    raw = spark.read.json("/work/falco.jsonl")

    events = (
        raw
        .filter(F.col("rule") == "Leviathan Shell Spawned In Container")
        .filter(F.col("output_fields.`k8s.ns.name`") == "leviathan")
        .select(
            F.col("uuid").alias("event_id"),
            F.col("time").alias("event_time"),
            F.col("rule"),
            F.lower(F.col("priority")).alias("severity"),
            F.col("source"),
            F.col("output_fields.`k8s.ns.name`").alias("namespace"),
            F.col("output_fields.`k8s.pod.name`").alias("pod"),
            F.col("output_fields.`container.name`").alias("container"),
            F.col("output_fields.`container.image.repository`").alias("image"),
            F.col("output_fields.`proc.cmdline`").alias("command")
        )
        .withColumn(
            "risk_score",
            F.when(F.col("severity") == "emergency", 100)
             .when(F.col("severity") == "alert", 95)
             .when(F.col("severity") == "critical", 90)
             .when(F.col("severity") == "error", 80)
             .when(F.col("severity") == "warning", 70)
             .when(F.col("severity") == "notice", 50)
             .when(F.col("severity") == "informational", 30)
             .otherwise(10)
        )
        .dropDuplicates(["event_id"])
    )

    print("=== LEVIATHAN NORMALIZED EVENTS ===", flush=True)
    events.show(truncate=False)

    rows = [r.asDict(recursive=True) for r in events.collect()]

    if not rows:
        raise RuntimeError(
            "No Leviathan Shell Spawned In Container events found in Kafka."
        )

    auth = os.environ["NEO4J_AUTH"]
    username, password = auth.split("/", 1)

    token = base64.b64encode(
        f"{username}:{password}".encode()
    ).decode()

    neo4j_url = (
        "http://neo4j.neo4j.svc.cluster.local:7474/"
        "db/neo4j/tx/commit"
    )

    cypher = """
    MERGE (w:Workload {
      namespace: $namespace,
      pod: $pod
    })
    SET
      w.container = $container,
      w.image = $image

    MERGE (r:FalcoRule {
      name: $rule
    })

    MERGE (e:SecurityEvent {
      uuid: $event_id
    })
    SET
      e.time = $event_time,
      e.severity = $severity,
      e.source = $source,
      e.command = $command,
      e.risk = $risk_score

    MERGE (w)-[:TRIGGERED]->(e)
    MERGE (e)-[:DETECTED_BY]->(r)
    """

    statements = [
        {
            "statement": cypher,
            "parameters": row
        }
        for row in rows
    ]

    payload = json.dumps({
        "statements": statements
    }).encode()

    request = urllib.request.Request(
        neo4j_url,
        data=payload,
        headers={
            "Content-Type": "application/json",
            "Authorization": f"Basic {token}"
        },
        method="POST"
    )

    with urllib.request.urlopen(request, timeout=20) as response:
        result = json.loads(response.read().decode())

    if result.get("errors"):
        raise RuntimeError(
            "Neo4j write failed: " + json.dumps(result["errors"])
        )

    def neo4j_query(statement, parameters=None):
        body = json.dumps({
            "statements": [{
                "statement": statement,
                "parameters": parameters or {}
            }]
        }).encode()

        req = urllib.request.Request(
            neo4j_url,
            data=body,
            headers={
                "Content-Type": "application/json",
                "Authorization": f"Basic {token}"
            },
            method="POST"
        )

        with urllib.request.urlopen(req, timeout=20) as response:
            data = json.loads(response.read().decode())

        if data.get("errors"):
            raise RuntimeError(
                "Neo4j query failed: " + json.dumps(data["errors"])
            )

        return data

    actionable = [
        row for row in rows
        if (row.get("risk_score") or 0) >= 70
        and row.get("namespace") == "leviathan"
        and row.get("pod")
    ]

    if not actionable:
        raise RuntimeError(
            "No actionable event found for automated containment."
        )

    latest = max(
        actionable,
        key=lambda row: row.get("event_time") or ""
    )

    event_id = latest.get("event_id")

    state = neo4j_query(
        """
        MATCH (e:SecurityEvent {uuid: $event_id})
        RETURN coalesce(e.containment_sent, false) AS sent
        """,
        {"event_id": event_id}
    )

    already_sent = False

    if (
        state.get("results")
        and state["results"][0].get("data")
    ):
        already_sent = bool(
            state["results"][0]["data"][0]["row"][0]
        )

    if already_sent:
        print(
            f"LEVIATHAN_N8N_SKIPPED duplicate_event={event_id}",
            flush=True
        )
    else:
        containment_event = {
            "event_id": event_id,
            "namespace": latest.get("namespace"),
            "pod": latest.get("pod"),
            "risk": latest.get("risk_score"),
            "rule": latest.get("rule"),
            "severity": latest.get("severity"),
            "command": latest.get("command"),
        }

        n8n_url = (
            "http://n8n.n8n.svc.cluster.local:5678/"
            "webhook/leviathan-containment"
        )

        n8n_request = urllib.request.Request(
            n8n_url,
            data=json.dumps(containment_event).encode(),
            headers={
                "Content-Type": "application/json"
            },
            method="POST"
        )

        with urllib.request.urlopen(
            n8n_request,
            timeout=20
        ) as response:
            n8n_status = response.status
            response.read()

        neo4j_query(
            """
            MATCH (e:SecurityEvent {uuid: $event_id})
            SET
              e.containment_sent = true,
              e.containment_sent_at = datetime()
            RETURN e.uuid
            """,
            {"event_id": event_id}
        )

        print(
            "LEVIATHAN_N8N_OK "
            f"pod={containment_event['pod']} "
            f"risk={containment_event['risk']} "
            f"status={n8n_status}",
            flush=True
        )

    print(
        f"LEVIATHAN_ETL_OK normalized={len(rows)} neo4j_written={len(rows)}",
        flush=True
    )

    spark.stop()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: leviathan-spark-etl
  namespace: neo4j
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app: leviathan-spark-etl
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app: leviathan-spark-etl
        spec:
          restartPolicy: Never
          enableServiceLinks: false

          initContainers:
            - name: kafka-export
              image: apache/kafka:4.3.1
              command:
                - /bin/bash
                - -ec
              args:
                - |
                  /opt/kafka/bin/kafka-console-consumer.sh \
                    --bootstrap-server kafka.kafka.svc.cluster.local:9092 \
                    --topic falco-alerts \
                    --from-beginning \
                    --timeout-ms 5000 \
                    > /work/falco.jsonl \
                    2>/work/kafka-consumer.log || true

                  echo "Kafka records exported:"
                  wc -l /work/falco.jsonl

                  test -s /work/falco.jsonl
              volumeMounts:
                - name: work
                  mountPath: /work

          containers:
            - name: spark
              image: apache/spark:3.5.3
              command:
                - /opt/spark/bin/spark-submit
                - --master
                - local[1]
                - --driver-memory
                - 512m
                - /opt/leviathan/etl.py
              envFrom:
                - secretRef:
                    name: neo4j-auth
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1024Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/leviathan
                - name: work
                  mountPath: /work

          volumes:
            - name: script
              configMap:
                name: leviathan-spark-script
            - name: work
              emptyDir: {}

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: leviathan-cilium-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/Naveenbana5250/Project-Leviathan.git
    targetRevision: main
    path: gitops/security/cilium
  destination:
    server: https://kubernetes.default.svc
    namespace: leviathan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

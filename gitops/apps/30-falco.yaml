apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: "9.2.0"
    helm:
      values: |
        driver:
          kind: modern_ebpf

        # This lab has no NAT Gateway, so Falco must not download
        # rules dynamically from the Internet at pod startup.
        falcoctl:
          artifact:
            install:
              enabled: false
            follow:
              enabled: false

        customRules:
          leviathan-rules.yaml: |-
            - rule: Leviathan Shell Spawned In Container
              desc: Detect an interactive or command shell spawned inside a container
              condition: evt.type in (execve, execveat) and evt.dir=< and container.id != host and proc.name in (sh, bash, ash, zsh)
              output: "LEVIATHAN_RUNTIME_ALERT shell spawned in container (container=%container.name command=%proc.cmdline user=%user.name)"
              priority: WARNING
              tags: [container, runtime, leviathan]
        falcosidekick:
          enabled: true
          replicaCount: 1
          webui:
            enabled: false
          config:
            kafka:
              hostport: "kafka.kafka.svc.cluster.local:9092"
              topic: "falco-alerts"
              topiccreation: true
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

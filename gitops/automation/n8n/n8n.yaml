apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-responder
  namespace: n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      enableServiceLinks: false
      serviceAccountName: n8n-responder
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.42.3
          env:
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
            - name: N8N_ENCRYPTION_KEY
              value: "demo-only-change-after-first-login"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            - name: KUBE_API
              value: "https://kubernetes.default.svc"
            - name: KUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-responder-token
                  key: token
            - name: NODE_EXTRA_CA_CERTS
              value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678

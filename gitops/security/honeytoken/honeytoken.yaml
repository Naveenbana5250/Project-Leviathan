apiVersion: v1
kind: ConfigMap
metadata:
  name: honeytoken-script
  namespace: leviathan
data:
  honeytoken.py: |
    import http.server, socketserver, json, time

    class Handler(http.server.BaseHTTPRequestHandler):
        def _event(self, body=""):
            event = {
              "type": "honeytoken_hit",
              "ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "path": self.path,
              "source_ip": self.client_address[0],
              "method": self.command,
              "user_agent": self.headers.get("user-agent", ""),
              "body": body[:512]
            }
            print(json.dumps(event), flush=True)

        def do_GET(self):
            self._event()
            self.send_response(200); self.end_headers()
            self.wfile.write(b"ok")

        def do_POST(self):
            n = int(self.headers.get("content-length", "0") or "0")
            body = self.rfile.read(n).decode("utf-8", errors="replace") if n else ""
            self._event(body)
            self.send_response(200); self.end_headers()
            self.wfile.write(b"ok")

    print("honeytoken listening on :8080", flush=True)
    socketserver.TCPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: honeytoken
  namespace: leviathan
  labels:
    app.kubernetes.io/name: honeytoken
    owner: defense-team
    env: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honeytoken
  template:
    metadata:
      labels:
        app: honeytoken
        app.kubernetes.io/name: honeytoken
        owner: defense-team
        env: demo
    spec:
      containers:
        - name: honeytoken
          image: python:3.13-alpine
          command: ["python", "/scripts/honeytoken.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: honeytoken-script
---
apiVersion: v1
kind: Service
metadata:
  name: honeytoken
  namespace: leviathan
spec:
  selector:
    app: honeytoken
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-credentials-decoy
  namespace: leviathan
  labels:
    purpose: honeytoken
data:
  credentials: |
    [default]
    aws_access_key_id = AKIAFAKELEVIATHANEXAMPLE
    aws_secret_access_key = FAKE/DECOY/ONLY/NOT/A/REAL/AWS/SECRET/KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-decoy
  namespace: leviathan
  labels:
    purpose: honeytoken
type: Opaque
stringData:
  username: honeyuser
  password: "Leviathan-Decoy-Only-ChangeMe"
